# Hosting on Render (https://render.com).
#  - atiyaherbs-api:   the main Atiya Herbs API (backend/): login, shop, doctors, appointments, videos. Steps: docs/DEPLOY_BACKEND.md
#  - atiyaherbs-calls: the call backend (call-backend/): a separate server for voice / video calls and meetings
services:
  - type: web
    name: atiyaherbs-api
    runtime: docker
    # "free" sleeps after 15 minutes without a request and takes about a minute to wake up: fine for a trial.
    # For real users change this to "starter" (always on).
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4100"
      - key: TRUST_PROXY
        value: "1"
      # production does not allow OTP_SENDER=dev; password login needs no OTP
      - key: OTP_SENDER
        value: sms
      - key: DB_SSL
        value: "true"
      - key: VIDEO_STORAGE
        value: database
      # Everything below is typed in Render's dashboard (Environment), never in this file or in a chat
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      # The public address of this API, e.g. https://atiyaherbs-api.onrender.com (written in front of a video's url)
      - key: PUBLIC_API_URL
        sync: false
      # The address of the admin panel, e.g. https://admin.atiyaherbs.com (comma separated for more)
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: atiyaherbs-calls
    runtime: docker
    plan: free
    dockerfilePath: ./call-backend/Dockerfile
    dockerContext: ./call-backend
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "4000"
      # Secrets: type these in Render's dashboard, never in this file
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # Agora as a second calling provider (optional). CALL_PROVIDER picks which one new calls use: livekit (default)
      # or agora. Agora calls cannot be recorded yet (recording is built on LiveKit).
      - key: CALL_PROVIDER
        sync: false
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      # Call links that open in a browser (Agora). Making a link needs this secret in the x-invite-key header.
      - key: INVITE_KEY
        sync: false
      # Call recording (optional). Leave empty to switch recording off.
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Leave empty for Cloudflare R2; for Backblaze B2 use its region, e.g. us-west-004
      - key: R2_REGION
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: D1_DATABASE_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
      # audio or video. Set in Render's dashboard (not here), so a push does not change it back.
      - key: RECORDING_MODE
        sync: false
      # Store recordings in Cloudinary (optional); R2 above is then only a short staging area
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_DELIVERY_TYPE
        value: authenticated
      # Shrink each recording after the call ends (ffmpeg is in the Docker image)
      # true, false, or cloudinary (Cloudinary shrinks a video itself). Also set in the dashboard.
      - key: RECORDING_COMPRESS
        sync: false
      - key: RECORDING_AUDIO_BITRATE
        sync: false
